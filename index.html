<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Eron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <div class="screen">
      <header class="top">
        <span class="logo">eron</span>
        <span id="clock" class="clock"></span>
      </header>

      <div class="center-area">
        <!-- Botão de microfone (posição inferior, como você pediu) -->
        <button id="micBtn" class="mic">🎤</button>
        <div id="status" class="status">Toque no microfone e fale seu lembrete</div>
      </div>

      <!-- Área de confirmação (aparece na tela do app, não é do navegador) -->
      <section id="confirmArea" class="confirm hidden"></section>

      <!-- Lista de compromissos -->
      <section class="list">
        <h2>Compromissos</h2>
        <div id="reminderList"></div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
