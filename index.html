<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Eron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f2ee">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Estilo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="auth-screen">
    <h2>Entrar no Eron</h2>

    <input id="loginEmail" type="email" placeholder="Email" />
    <div class="password-field">
      <input id="loginPassword" type="password" placeholder="Senha" />
      <button type="button" onclick="togglePassword('loginPassword')">👁</button>
    </div>

    <button id="loginBtn">Entrar</button>

    <p>
      Não tem conta?
      <a href="#" id="goToRegister">Criar conta</a>
    </p>
  </div>

  <!-- ================= CADASTRO ================= -->
  <div id="registerScreen" class="auth-screen hidden">
    <h2>Criar conta</h2>

    <input id="registerEmail" type="email" placeholder="Email" />

    <div class="password-field">
      <input id="registerPassword" type="password" placeholder="Senha" />
      <button type="button" onclick="togglePassword('registerPassword')">👁</button>
    </div>

    <div class="password-field">
      <input id="registerPasswordConfirm" type="password" placeholder="Confirmar senha" />
      <button type="button" onclick="togglePassword('registerPasswordConfirm')">👁</button>
    </div>

    <button id="registerBtn">Criar conta</button>

    <p>
      Já tem conta?
      <a href="#" id="goToLogin">Voltar para login</a>
    </p>
  </div>

  <!-- ================= APP ================= -->
  <div id="appScreen" class="phone hidden">
    <div class="screen">

      <header class="top">
        <button id="menuBtn" class="menu-btn">☰</button>
        <div class="brand">
          <div class="star">✦</div>
          <div class="name">eron</div>
        </div>
      </header>

      <aside id="sideMenu" class="side-menu hidden">
        <h3>Configurações</h3>
        <button id="menuHome">Início</button>
        <button id="menuAccount">Conta</button>
        <button id="menuPlan">Plano</button>
        <button id="menuNotifications">Notificações</button>
        <button id="logoutBtn">Sair</button>
      </aside>

      <div id="mainHome">
        <section id="confirmArea" class="confirm hidden"></section>
        <section class="list">
          <div id="reminderList"></div>
        </section>
        <footer class="privacy">Só você terá acesso a isso.</footer>
      </div>

      <div id="accountScreen" class="hidden">
        <h3>Minha Conta</h3>
      </div>

      <div id="planScreen" class="hidden">
        <h3>Plano</h3>
      </div>

      <div id="notificationsScreen" class="hidden">
        <h3>Notificações</h3>
      </div>

      <div class="talk-area-fixed">
        <div class="talk-area">
          <button id="micBtn" class="talk-btn">
            <span class="mic">🎤</span>
            <span>Falar agora</span>
          </button>
          <div id="status" class="hint">Toque e fale seu lembrete</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ✅ SUPABASE SDK (OBRIGATÓRIO) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Seu script -->
  <script src="script.js"></script>

</body>
</html>
