<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Eron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f2ee">

  <!-- Estilo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <div class="screen">
      <header class="top">
        <div class="brand">
          <div class="star">✦</div>
          <div class="name">eron</div>
        </div>
      </header>

      <!-- Área central vazia (como na imagem) -->
      <div class="spacer"></div>

      <!-- Botão de falar (mais embaixo) -->
      <div class="talk-area">
        <button id="micBtn" class="talk-btn">
          <span class="mic">🎤</span>
          <span>Falar agora</span>
        </button>
        <div id="status" class="hint">Toque e fale seu lembrete</div>
      </div>

      <!-- Confirmação em tela -->
      <section id="confirmArea" class="confirm hidden"></section>

      <!-- Lista de compromissos -->
      <section class="list">
        <div id="reminderList"></div>
      </section>

      <footer class="privacy">Só você terá acesso isso.</footer>
    </div>
  </div>

  <!-- Script principal -->
  <script src="script.js"></script>

  <!-- Registro do Service Worker (para instalar como app) -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
